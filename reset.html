<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Refreshing itinerary cache</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #FDFAF4;
      color: #2A2320;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 28rem;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      color: #3C613D;
      font-size: 1.25rem;
      margin: 0 0 0.5rem;
    }
    p {
      color: #7A6F66;
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Refreshing itinerary</h1>
    <p>This should only take a moment.</p>
  </main>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const fallback = '/?id=olicoy-italia-2026-k7n4&fresh=cache-reset';
      const target = params.get('to') || fallback;

      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg => reg.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
      } catch (_) {
        // Best-effort cleanup. Redirect even if one browser API fails.
      }

      window.location.replace(target);
    })();
  </script>
</body>
</html>
